# Render blueprint for the backend.
# Secrets are marked sync:false so they are entered in the dashboard, never here.
services:
  - type: web
    name: ine-price-tracker-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # No `--with-deps`: that flag shells out to `sudo apt-get`, and Render's build
    # sandbox cannot escalate to root, so it fails the build. The base image
    # already carries the shared libraries Chromium needs.
    # `npm ci` alone is enough -- the postinstall hook downloads Chromium.
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: info
      - key: SCRAPE_CONCURRENCY
        value: 2
      # Playwright caches browsers here so they survive between deploys.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.cache/ms-playwright
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
